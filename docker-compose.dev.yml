services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: interview-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ChromaDB (Vector Store)
  chroma:
    image: chromadb/chroma:0.5.23
    container_name: interview-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_NOAUTH_CREDENTIALS=TRUE
      - IS_PERSISTENT=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      timeout: 10s
      retries: 5

  # SMTP Relay (Real Email Sending)
  smtp-relay:
    image: juanluisbaptiste/postfix
    container_name: interview-smtp-relay
    ports:
      - "25:25"
    environment:
      - SMTP_SERVER=${RELAY_HOST}
      - SMTP_PORT=${RELAY_PORT}
      - SMTP_USERNAME=${RELAY_USERNAME}
      - SMTP_PASSWORD=${RELAY_PASSWORD}
      - SERVER_HOSTNAME=interview-platform.com
      # Trust all internal networks (for relaying from backend)
      - SMTP_NETWORKS=0.0.0.0/0


volumes:
  postgres_data:
  chroma_data:
